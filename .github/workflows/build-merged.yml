name: Build Merged Single File

# 当 SKILL.md 或 references/ 下任何文件变化时，自动重新生成合并单文件
# 供有"知识库文件数上限"或不想逐个上传多文件的 AI 平台使用
# 合并逻辑在 scripts/build-merged.sh，validate 会复用同一脚本做新鲜度检查
on:
  push:
    branches: [main]
    paths:
      - 'skills/euro-grad-apply/SKILL.md'
      - 'skills/euro-grad-apply/references/**'
      - 'scripts/build-merged.sh'
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build merged file
        run: bash scripts/build-merged.sh

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet euro-grad-apply-full.md; then
            echo "无变化，跳过提交"
          else
            git add euro-grad-apply-full.md
            git commit -m "chore: 自动更新合并单文件 euro-grad-apply-full.md"
            git push
          fi
